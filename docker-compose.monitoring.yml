services:
  prometheus:
    image: prom/prometheus:latest
    container_name: hotel-booking-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: hotel-booking-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
